name: Refresh Macro Snapshot

on:
  schedule:
    - cron: "5 21 * * 1-5"
    - cron: "5 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: refresh-macro-snapshot
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Gate publish window (US close + 1h)
        id: publish_window
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "window_reason=manual_dispatch" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          et_weekday="$(TZ=America/New_York date +%u)"
          et_hour="$(TZ=America/New_York date +%H)"
          et_stamp="$(TZ=America/New_York date '+%F %H:%M')"
          echo "Current ET: $et_stamp"

          if [ "$et_weekday" -gt 5 ]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "window_reason=weekend" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$et_hour" = "17" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "window_reason=market_close_plus_1h" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "window_reason=outside_publish_hour" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate snapshot
        id: generate
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          chmod +x scripts/refresh_static_snapshot_ci.sh
          STATUS_FILE="$RUNNER_TEMP/macro_snapshot_status.json"
          echo "status_file=$STATUS_FILE" >> "$GITHUB_OUTPUT"
          should_run="${{ steps.publish_window.outputs.should_run }}"
          window_reason="${{ steps.publish_window.outputs.window_reason }}"

          if [ "$should_run" != "true" ]; then
            printf '%s\n' \
              '{' \
              '  "result": "skipped_window",' \
              "  \"message\": \"Skipped snapshot refresh (${window_reason}).\"," \
              '  "mode": null,' \
              '  "readyModules": 0,' \
              "  \"reason\": \"${window_reason}\"" \
              '}' > "$STATUS_FILE"
            echo "exit_code=0" >> "$GITHUB_OUTPUT"
            cat "$STATUS_FILE"
            exit 0
          fi

          set +e
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            STATUS_FILE="$STATUS_FILE" ./scripts/refresh_static_snapshot_ci.sh --force
          else
            STATUS_FILE="$STATUS_FILE" ./scripts/refresh_static_snapshot_ci.sh
          fi
          exit_code=$?
          set -e
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          if [ ! -f "$STATUS_FILE" ]; then
            printf '%s\n' \
              '{' \
              '  "result": "error",' \
              '  "message": "Snapshot generator did not produce a status file.",' \
              '  "mode": null,' \
              '  "readyModules": 0,' \
              '  "reason": null' \
              '}' > "$STATUS_FILE"
          fi
          cat "$STATUS_FILE"

      - name: Parse snapshot status
        id: status
        run: |
          python scripts/export_snapshot_status_outputs.py "$STATUS_FILE" _gha_outputs.txt
          cat _gha_outputs.txt >> "$GITHUB_OUTPUT"
        env:
          STATUS_FILE: ${{ steps.generate.outputs.status_file }}

      - name: Detect snapshot changes
        id: detect_changes
        run: |
          if [ -n "$(git status --porcelain -- web/public/data/macro-data.json)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update alert issue
        if: steps.generate.outputs.exit_code != '0' || steps.status.outputs.result == 'kept_existing' || steps.status.outputs.result == 'refused_degraded' || steps.status.outputs.result == 'error'
        uses: actions/github-script@v7
        env:
          STATUS_RESULT: ${{ steps.status.outputs.result }}
          STATUS_MODE: ${{ steps.status.outputs.mode }}
          STATUS_MESSAGE: ${{ steps.status.outputs.message }}
          STATUS_REASON: ${{ steps.status.outputs.reason }}
          STATUS_READY_MODULES: ${{ steps.status.outputs.ready_modules }}
          GENERATE_EXIT_CODE: ${{ steps.generate.outputs.exit_code }}
        with:
          script: |
            const title = "Macro snapshot refresh alert";
            const body = [
              "The scheduled post-close macro snapshot refresh detected a data quality problem. The workflow did not publish the new snapshot.",
              "",
              `- Result: ${process.env.STATUS_RESULT}`,
              `- Exit code: ${process.env.GENERATE_EXIT_CODE}`,
              `- Mode: ${process.env.STATUS_MODE || "unknown"}`,
              `- Ready modules: ${process.env.STATUS_READY_MODULES}`,
              `- Message: ${process.env.STATUS_MESSAGE || "n/a"}`,
              `- Reason: ${process.env.STATUS_REASON || "n/a"}`,
              `- Detected at: ${new Date().toISOString()}`,
            ].join("\n");

            const { owner, repo } = context.repo;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: "open",
              per_page: 100,
            });

            const existing = issues.find((issue) => issue.title === title);

            if (existing) {
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner,
                repo,
                title,
                body,
              });
            }

      - name: Close alert issue after recovery
        if: steps.generate.outputs.exit_code == '0' && steps.status.outputs.result == 'updated'
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Macro snapshot refresh alert";
            const { owner, repo } = context.repo;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: "open",
              per_page: 100,
            });

            const existing = issues.find((issue) => issue.title === title);
            if (!existing) {
              return;
            }

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: existing.number,
              body: `Snapshot refresh recovered at ${new Date().toISOString()}.`,
            });

            await github.rest.issues.update({
              owner,
              repo,
              issue_number: existing.number,
              state: "closed",
            });

      - name: Commit updated snapshot
        if: steps.detect_changes.outputs.changed == 'true' && steps.generate.outputs.exit_code == '0' && steps.status.outputs.result == 'updated'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public/data/macro-data.json
          git commit -m "chore(data): refresh macro snapshot"
          git fetch origin main
          if ! git rebase origin/main; then
            git rebase --abort || true
            echo "Failed to rebase snapshot commit onto latest origin/main." >&2
            exit 1
          fi
          git push origin HEAD:main

      - name: Validate Cloudflare credentials
        if: (steps.detect_changes.outputs.changed == 'true' || github.event_name == 'workflow_dispatch') && steps.generate.outputs.exit_code == '0' && steps.status.outputs.result == 'updated'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "Missing Cloudflare secrets. Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in GitHub repository secrets." >&2
            exit 1
          fi
          if [ -z "${PAGES_PROJECT_NAME}" ]; then
            echo "Missing CLOUDFLARE_PAGES_PROJECT_NAME repository variable." >&2
            exit 1
          fi

      - name: Set up Node
        if: (steps.detect_changes.outputs.changed == 'true' || github.event_name == 'workflow_dispatch') && steps.generate.outputs.exit_code == '0' && steps.status.outputs.result == 'updated'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        if: (steps.detect_changes.outputs.changed == 'true' || github.event_name == 'workflow_dispatch') && steps.generate.outputs.exit_code == '0' && steps.status.outputs.result == 'updated'
        run: cd web && npm ci

      - name: Build static site
        if: (steps.detect_changes.outputs.changed == 'true' || github.event_name == 'workflow_dispatch') && steps.generate.outputs.exit_code == '0' && steps.status.outputs.result == 'updated'
        run: cd web && npm run build:cf

      - name: Deploy to Cloudflare Pages
        if: (steps.detect_changes.outputs.changed == 'true' || github.event_name == 'workflow_dispatch') && steps.generate.outputs.exit_code == '0' && steps.status.outputs.result == 'updated'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }}
        run: |
          cd web
          npx wrangler pages deploy out --project-name "${PAGES_PROJECT_NAME}" --commit-dirty=true
