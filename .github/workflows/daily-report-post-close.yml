name: Generate Market Daily Report

on:
  schedule:
    - cron: "5 * * * 1-5"
  workflow_dispatch:
    inputs:
      days_ago:
        description: "Manual backfill days (0=today/latest, 1=yesterday)"
        required: false
        default: "0"
      require_gemini:
        description: "Fail workflow if published report is not Gemini-generated"
        required: false
        default: "true"

permissions:
  contents: write

concurrency:
  group: market-daily-report
  cancel-in-progress: false

jobs:
  generate-daily-report:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Gate publish window (US close + 1h)
        id: publish_window
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "window_reason=manual_dispatch" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          et_weekday="$(TZ=America/New_York date +%u)"
          et_hour="$(TZ=America/New_York date +%H)"
          et_minute="$(TZ=America/New_York date +%M)"
          et_stamp="$(TZ=America/New_York date '+%F %H:%M')"
          echo "Event=${{ github.event_name }} Current ET: $et_stamp (weekday=$et_weekday hour=$et_hour minute=$et_minute)"

          if [ "$et_weekday" -gt 5 ]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "window_reason=weekend" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$et_hour" = "17" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "window_reason=market_close_plus_1h" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "window_reason=outside_publish_hour" >> "$GITHUB_OUTPUT"
          fi

      - name: Stop outside publish window
        if: steps.publish_window.outputs.should_run != 'true'
        run: |
          echo "Skip daily report generation: ${{ steps.publish_window.outputs.window_reason }}"
          exit 0

      - name: Set up Python
        if: steps.publish_window.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        if: steps.publish_window.outputs.should_run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Refresh snapshot before daily report
        if: steps.publish_window.outputs.should_run == 'true'
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          MARKET_DAILY_AI_MODEL: ${{ vars.MARKET_DAILY_AI_MODEL }}
          MARKET_DAILY_AI_REASONING_MODE: deep_think
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            DAYS_AGO="${{ github.event.inputs.days_ago || '0' }}"
          else
            DAYS_AGO="0"
          fi
          echo "Generating snapshot for days_ago=${DAYS_AGO}"
          mkdir -p .cache/daily-report
          python generate_static_macro_json.py \
            --output .cache/daily-report/macro-data.json \
            --as-of-days-ago "${DAYS_AGO}" \
            --allow-degraded

      - name: Generate daily report digest
        if: steps.publish_window.outputs.should_run == 'true'
        env:
          PYTHONPATH: ${{ github.workspace }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          MARKET_DAILY_AI_PROVIDER: gemini
          MARKET_DAILY_AI_REASONING_MODE: deep_think
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          MARKET_DAILY_AI_MODEL: ${{ vars.MARKET_DAILY_AI_MODEL }}
          MARKET_NEWS_RSS_URLS: ${{ vars.MARKET_NEWS_RSS_URLS }}
        run: |
          python scripts/generate_daily_report_digest.py \
            --input .cache/daily-report/macro-data.json \
            --json-output .cache/daily-report/market-daily.json \
            --md-output .cache/daily-report/market-daily.md \
            --prefer-ai-markdown \
            --min-chars 1500 \
            --max-output-tokens 12288 \
            --continuation-rounds 10 \
            --publish-output web/public/data/market-daily-latest.json

      - name: Validate Gemini generation result
        if: steps.publish_window.outputs.should_run == 'true'
        env:
          REQUIRE_GEMINI_INPUT: ${{ github.event.inputs.require_gemini || 'true' }}
        run: |
          SOURCE="$(jq -r '.markdownSource // "unknown"' web/public/data/market-daily-latest.json)"
          AI_STATUS="$(jq -r '.daily.aiDecision.status // "unknown"' web/public/data/market-daily-latest.json)"
          AI_RENDER="$(jq -c '.aiRender // {}' web/public/data/market-daily-latest.json)"
          echo "Daily markdownSource=${SOURCE}"
          echo "Daily aiDecision.status=${AI_STATUS}"
          echo "Daily aiRender=${AI_RENDER}"

          REQUIRE_GEMINI="${REQUIRE_GEMINI_INPUT}"
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            REQUIRE_GEMINI="true"
          fi

          if [ "${REQUIRE_GEMINI}" = "true" ] && [ "${SOURCE}" != "gemini" ]; then
            echo "::error::Daily report is not Gemini-generated (markdownSource=${SOURCE})."
            exit 1
          fi

      - name: Publish workflow summary
        if: steps.publish_window.outputs.should_run == 'true'
        run: |
          cat .cache/daily-report/market-daily.md >> "$GITHUB_STEP_SUMMARY"

      - name: Optional webhook push
        if: steps.publish_window.outputs.should_run == 'true' && env.DAILY_REPORT_WEBHOOK_URL != ''
        env:
          DAILY_REPORT_WEBHOOK_URL: ${{ secrets.DAILY_REPORT_WEBHOOK_URL }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          from pathlib import Path

          url = os.environ["DAILY_REPORT_WEBHOOK_URL"].strip()
          text = Path(".cache/daily-report/market-daily.md").read_text(encoding="utf-8")
          payload = {"text": text}
          req = urllib.request.Request(
              url,
              data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          with urllib.request.urlopen(req, timeout=10) as resp:
              print(f"Webhook pushed with status {resp.status}")
          PY

      - name: Upload daily report artifact
        if: steps.publish_window.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: market-daily-report
          path: |
            .cache/daily-report/market-daily.json
            .cache/daily-report/market-daily.md
            web/public/data/market-daily-latest.json
          if-no-files-found: error
          retention-days: 7

      - name: Detect daily cache changes
        if: steps.publish_window.outputs.should_run == 'true'
        id: detect_daily_cache
        run: |
          if [ -n "$(git status --porcelain -- web/public/data/market-daily-latest.json)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit daily cache
        if: steps.publish_window.outputs.should_run == 'true' && steps.detect_daily_cache.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public/data/market-daily-latest.json
          git commit -m "chore(data): refresh market daily report cache"
          git fetch origin main
          if ! git rebase origin/main; then
            git rebase --abort || true
            echo "Failed to rebase daily cache commit onto latest origin/main." >&2
            exit 1
          fi
          git push origin HEAD:main

      - name: Validate Cloudflare credentials
        if: steps.publish_window.outputs.should_run == 'true' && steps.detect_daily_cache.outputs.changed == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "Missing Cloudflare secrets. Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in GitHub repository secrets." >&2
            exit 1
          fi
          if [ -z "${PAGES_PROJECT_NAME}" ]; then
            echo "Missing CLOUDFLARE_PAGES_PROJECT_NAME repository variable." >&2
            exit 1
          fi

      - name: Set up Node
        if: steps.publish_window.outputs.should_run == 'true' && steps.detect_daily_cache.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        if: steps.publish_window.outputs.should_run == 'true' && steps.detect_daily_cache.outputs.changed == 'true'
        run: cd web && npm ci

      - name: Build static site
        if: steps.publish_window.outputs.should_run == 'true' && steps.detect_daily_cache.outputs.changed == 'true'
        run: cd web && npm run build:cf

      - name: Deploy to Cloudflare Pages
        if: steps.publish_window.outputs.should_run == 'true' && steps.detect_daily_cache.outputs.changed == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }}
        run: |
          cd web
          npx wrangler pages deploy out --project-name "${PAGES_PROJECT_NAME}" --commit-dirty=true
